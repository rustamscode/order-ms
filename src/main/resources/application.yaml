###### Server ######
server:
  port: 6060
  servlet:
    context-path: /orders

###### Spring ######
spring:
  application:
    name: order-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres # ${DB_URL}
    username: postgres # ${DB_USERNAME}
    password: pass # ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

outbox:
  scheduler:
    lock:
      environment: prod
      keyPrefix: order-ms
